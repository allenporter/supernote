---
name: Lint

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          check_hidden: false
          ignore_words_list: folde
          skip: ./.git,./evals/ocr/dataset.yaml,./evals/ocr/results
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: "./"
          config_file: "./.yaml-lint.yaml"
          strict: true

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements_dev.txt"
          activate-environment: true
      - name: Install dependencies
        run: |
          uv pip install -r requirements_dev.txt

      - name: Run Ruff Check
        run: |
          ruff check --output-format=github .

      - name: Run Ruff Format
        run: |
          ruff format --check .
      - name: Static typing with ty
        run: |
          ty check . --ignore import-not-found

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-tsc-${{ hashFiles('.github/workflows/lint.yaml') }}
          restore-keys: |
            ${{ runner.os }}-tsc-

      - name: Static typing for frontend JS (tsc)
        run: |
          npx --yes --package=typescript@7.0.2 -- tsc -p tsconfig.json --noEmit

      - name: Lint and format check frontend JS (biome)
        run: |
          npx --yes --package=@biomejs/biome@2.6.8 -- biome check --error-on-warnings supernote/server/static/js tests/frontend
