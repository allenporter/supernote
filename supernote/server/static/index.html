<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supernote Knowledge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
          }
        }
    </script>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased h-screen overflow-hidden">
    <div id="app" class="flex h-screen w-full overflow-hidden" v-cloak>
        <template v-if="isLoggedIn">
            <!-- Mobile Drawer Overlay Backdrop -->
            <div v-if="isSidebarOpen" @click="isSidebarOpen = false" class="fixed inset-0 z-30 bg-black/20 md:hidden"></div>

            <!-- Left Sidebar -->
            <sidebar :active-tab="activeTab" :breadcrumbs="breadcrumbs" :subfolders="folders" :current-directory-id="currentDirectoryId"
                :is-dark-mode="isDarkMode" :is-open="isSidebarOpen" @close="isSidebarOpen = false"
                @navigate-tab="activeTab = $event; view = 'grid'"
                @navigate-folder="navigateFolder($event)" @toggle-theme="toggleTheme"
                @toggle-system="showSystemPanel = true"></sidebar>

            <!-- Main Content Area -->
            <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50/60 dark:bg-slate-950/60">
                <!-- Top Navbar with Unified Search & Account Controls -->
                <header class="sticky top-0 z-30 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 py-2.5 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3 flex-1 max-w-md">
                        <button @click="isSidebarOpen = !isSidebarOpen" class="md:hidden p-1 text-slate-500 hover:text-slate-800 rounded-md flex-shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                        <!-- Unified Global Search Input Trigger -->
                        <button @click="showSearchModal = true"
                            class="flex items-center gap-2.5 bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-slate-600 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all w-full border border-slate-200 dark:border-slate-700">
                            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                            <span class="flex-1 text-left truncate">Search notebooks, transcripts, or tasks...</span>
                            <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded shadow-xs text-slate-400">⌘K</kbd>
                        </button>
                    </div>

                    <!-- Right Controls: Upload & User Profile Badge -->
                    <div class="flex items-center gap-3">
                        <button @click="triggerUpload" class="px-3.5 py-1.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:bg-slate-800 text-xs font-semibold rounded-lg transition-all shadow-xs flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Upload
                        </button>

                        <div class="h-4 w-[1px] bg-slate-200 dark:border-slate-800"></div>

                        <!-- User Profile Badge -->
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 font-bold text-[10px] flex items-center justify-center border border-indigo-200/50">
                                d
                            </div>
                            <span class="text-xs font-medium text-slate-700 dark:text-slate-300 hidden sm:inline-block">debug@example.com</span>
                            <button @click="handleLogout" class="text-xs text-slate-400 hover:text-rose-600 transition-colors ml-1" title="Sign Out">
                                Sign Out
                            </button>
                        </div>
                    </div>
                </header>

                <!-- Scrollable Body Workspace -->
                <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                    <!-- Tab 1: AI Knowledge Hub Dashboard -->
                    <dashboard-view v-if="activeTab === 'dashboard'" :recent-notes="recentNotes"
                        :processing-statuses="processingStatuses"
                        @open-file="openItem($event)" @open-search="showSearchModal = true"
                        @navigate-tab="activeTab = $event"></dashboard-view>

                    <!-- Tab 2: VFS File Explorer -->
                    <div v-else-if="activeTab === 'explorer'" class="space-y-6 animate-fade-in max-w-6xl mx-auto w-full">
                        <!-- Header & Actions -->
                        <div class="flex flex-wrap items-center justify-between gap-4 pb-2 border-b border-slate-200 dark:border-slate-800">
                            <div>
                                <h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Files Explorer</h2>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Manage your synced Supernote notebooks and directory tree</p>
                            </div>

                            <div class="flex items-center gap-2">
                                <button @click="showNewFolderModal = true"
                                    class="px-3 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-medium rounded-lg transition-colors flex items-center gap-1.5 shadow-xs">
                                    <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                    New Folder
                                </button>
                            </div>
                        </div>

                        <!-- Breadcrumb Bar -->
                        <nav class="flex items-center gap-1 text-xs text-slate-500 font-medium bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-xs">
                            <template v-for="(crumb, idx) in breadcrumbs" :key="crumb.id">
                                <span v-if="idx > 0" class="text-slate-300 dark:text-slate-700 mx-1">/</span>
                                <button @click="navigateTo(idx)"
                                    :class="idx === breadcrumbs.length - 1 ? 'font-bold text-indigo-600 dark:text-indigo-400' : 'hover:text-slate-900 dark:hover:text-slate-200'"
                                    class="transition-colors">
                                    {{ crumb.name }}
                                </button>
                            </template>
                        </nav>

                        <!-- Multi-select Action Bar -->
                        <div v-if="selectedIds.length > 0"
                            class="bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-900/60 p-3 rounded-xl flex items-center justify-between shadow-xs">
                            <span class="text-xs font-semibold text-indigo-900 dark:text-indigo-200">{{ selectedIds.length }} item(s) selected</span>
                            <div class="flex items-center gap-2">
                                <button @click="showMoveModal = true" class="px-3 py-1 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-medium rounded-md shadow-xs">Move</button>
                                <button @click="handleBatchDelete" class="px-3 py-1 bg-rose-600 text-white text-xs font-medium rounded-md shadow-xs hover:bg-rose-700">Delete</button>
                            </div>
                        </div>

                        <!-- Loading Spinner -->
                        <div v-if="isLoading" class="flex justify-center py-16">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                        </div>

                        <!-- Empty State -->
                        <div v-else-if="files.length === 0" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-12 text-center shadow-xs">
                            <p class="text-xs text-slate-400">This folder is empty.</p>
                        </div>

                        <!-- File Cards Grid -->
                        <div v-else class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <file-card v-for="file in files" :key="file.id" :file="file"
                                :is-selected="selectedIds.includes(file.id)"
                                :processing-status="processingStatuses[file.id]"
                                @open="openItem($event)"
                                @select="toggleSelection(file.id)"
                                @rename="itemToRename = file; showRenameModal = true"
                                @delete="handleSingleDelete(file)"></file-card>
                        </div>
                    </div>

                    <!-- Tab 3: Schedule & Actionable Tasks -->
                    <task-panel v-else-if="activeTab === 'tasks'"></task-panel>
                </main>
            </div>

            <!-- Notebook Reader Overlay View -->
            <div v-if="selectedFile" class="fixed inset-0 z-50 bg-slate-100 dark:bg-slate-950">
                <file-viewer :file="selectedFile" @close="selectedFile = null"></file-viewer>
            </div>

            <!-- Global Search Modal Overlay (⌘K) -->
            <search-modal v-if="showSearchModal" @close="showSearchModal = false" @open-file="openItem($event); showSearchModal = false"></search-modal>

            <!-- Modals -->
            <system-panel v-if="showSystemPanel" @close="showSystemPanel = false"></system-panel>
            <rename-modal v-if="showRenameModal" :item="itemToRename" @close="showRenameModal = false" @save="handleRenameSave"></rename-modal>
            <move-modal v-if="showMoveModal" :subfolders="folders" :selected-ids="selectedIds" @close="showMoveModal = false" @move="handleMoveSave"></move-modal>

            <div v-if="showNewFolderModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/30 backdrop-blur-[2px]">
                <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white">Create New Folder</h3>
                    <input v-model="newFolderName" type="text" placeholder="Folder name..." class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none text-slate-900 dark:text-slate-100">
                    <div class="flex justify-end gap-2">
                        <button @click="showNewFolderModal = false" class="px-3.5 py-1.5 text-xs text-slate-500 hover:text-slate-700">Cancel</button>
                        <button @click="handleCreateFolder" class="px-3.5 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl shadow-xs">Create</button>
                    </div>
                </div>
            </div>

            <input type="file" ref="fileInput" class="hidden" @change="handleFileUpload" accept=".note,.pdf,.png,.jpg,.jpeg,.epub,.mark">
        </template>

        <template v-else>
            <login-card @login="handleLogin"></login-card>
        </template>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>

</html>
