# Supernote Server Configuration Example
#
# This file serves as a reference for configuring the Supernote Server.
# Copy this file to `config.yaml` and adjust the values as needed.
---
# Host and port to bind the server to.
host: 0.0.0.0
port: 8080

# Root log level. Unknown names fall back to INFO.
# Override with the SUPERNOTE_LOG_LEVEL environment variable.
# log_level: INFO

# Directory where uploaded files and databases will be stored.
storage_dir: storage

# Optional: Path to trace log file for debugging (default: storage/system/trace.log)
# trace_log_file: storage/system/trace.log
# trace_log_unsafe: false # Set to true to log unredacted tokens/credentials in trace.log for debugging

# Proxy header handling mode (optional, defaults to 'relaxed')
# - 'relaxed': Trust the immediate upstream proxy (suitable for Docker/local setups)
# - 'strict': Only trust specific proxy IPs (configured in trusted_proxies)
# Use 'strict' for production deployments behind known proxies.
proxy_mode: strict

# List of trusted proxy IPs/networks (used when proxy_mode is 'strict')
# Supports CIDR notation for network ranges.
trusted_proxies:
  - 127.0.0.1
  - ::1
  - 172.17.0.0/16 # Docker bridge network
  # Add your reverse proxy IP here, e.g.:
  # - 10.0.1.5

# Authentication settings
auth:
  # Secret key used for signing session tokens.
  # IMPORTANT: Change this to a random secure string for production use.
  # You can generate one using `openssl rand -hex 32` or similar tools.
  secret_key: "CHANGE_ME_TO_A_SECURE_RANDOM_STRING"

  # Token expiration time in hours.
  expiration_hours: 168 # 7 days

  # Whether to allow public registration.
  # If false, users must be created via the admin CLI.
  # The first user created (or added via the admin CLI) will be an admin.
  enable_registration: false

  # Whether to allow remote password reset via email.
  # When disabled, the public password reset endpoint returns 403.
  enable_remote_password_reset: false

# Outbound webhook dispatch (optional).
# Sends a signed HTTP POST to each endpoint when a subscribed event occurs
# for the specified user account, e.g. to trigger a Home Assistant, n8n, or
# Zapier automation on note sync.
# webhooks:
#   enabled: true
#   endpoints:
#     - url: "https://n8n.homelab.local/webhook/supernote"
#       # Email address of the user account whose events this endpoint receives.
#       user: "user@example.com"
#       # Shared secret used to HMAC-SHA256 sign each payload. Sent to the
#       # endpoint in the `X-Supernote-Signature: sha256=<hex>` header so it
#       # can verify the request came from this server and was not altered.
#       secret: "CHANGE_ME_TO_A_SECURE_RANDOM_STRING"
#       # Event names this endpoint wants to receive. Omit (or leave empty)
#       # to receive every event for this user.
#       events:
#         - "note.sync_completed"
#         - "note.processing_completed"

# AI providers and per-capability model configuration (optional)
# ai:
#   providers:
#     gemini:
#       api_key: "CHANGE_ME_TO_YOUR_GEMINI_API_KEY"
#     openai:
#       base_url: "http://localhost:11434/v1"
#       api_key: "ollama"
#   ocr:
#     provider: gemini
#     model: gemini-3.6-flash
#     max_concurrency: 5
#   summary:
#     provider: gemini
#     model: gemini-3.6-flash
#     max_concurrency: 5
#   embedding:
#     provider: gemini
#     model: gemini-embedding-001
#     max_concurrency: 5

# Web interface and MCP settings (optional)
# web_enabled: true # Set to false to disable web dashboard and static routes (default: true)
# web_notebook_preview: true # Set to false to disable heavy notebook page rendering for web preview (default: true)
# mcp_enabled: true # Set to false to disable the Model Context Protocol (MCP) server and OAuth endpoints (default: true)
