  - file_name: Reading_Notes_DDIA.note
    description: 3-page book notes on Designing Data-Intensive Applications.
    pages:
      - page_index: 0
        page_id: P20261012200000DDIA00001
        text_content: |-
          Designing Data-Intensive Applications - Martin Kleppmann
          Ch 3 Storage & Retrieval:
          - LSM-trees optimize write throughput via sequential append + compaction
          - B-trees give predictable read latency and in-place page updates
          - Write-ahead log (WAL) ensures crash recovery in SQLite & Postgres
          Relevant to Q4 Cloud Release: check SQLite WAL checkpoint interval!
      - page_index: 1
        page_id: P20261017210000DDIA00002
        text_content: |-
          DDIA Ch 5 Replication:
          - Single-leader replication: simple read-your-writes consistency for leader reads
          - Replication lag pitfalls: monotonic reads, consistent prefix reads
          - For personal Supernote cloud on Aurora, single-node SQLite + restic B2
            avoids distributed split-brain complexity entirely.
      - page_index: 2
        page_id: P20261025210000DDIA00003
        text_content: |-
          DDIA Ch 7 Transactions:
          - Snapshot isolation prevents dirty reads and non-repeatable reads
          - Optimistic concurrency (version numbers) beats long locks for interactive UIs
          - Matches our Wiki page `expected_version` optimistic locking design.

