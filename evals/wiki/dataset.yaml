    pages:
      - page_index: 0
        page_id: P20261023210000DESIGN01
        text_content: |-
          The Design of Everyday Things - Don Norman
          Key principles:
          - Discoverability: users should immediately see what actions are possible
          - Feedback: every action needs clear, immediate confirmation of state
          - Conceptual models: hide internal mechanics (like DB cursors) behind
            a clear mental model of progress.
          Applied to Q4 Cloud Release: show exact notebook queue & progress bar in Wiki UI.

