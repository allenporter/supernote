  - file_name: Reading_Notes_Design.note
    description: 2-page book notes on The Design of Everyday Things.
    pages:
      - page_index: 0
        page_id: P20261023210000DESIGN01
        text_content: |-
          The Design of Everyday Things - Don Norman
          Key principles:
          - Discoverability: users should immediately see what actions are possible
          - Feedback: every action needs clear, immediate confirmation of state
          - Conceptual models: hide internal mechanics (like DB cursors) behind
            a clear mental model of progress.
      - page_index: 1
        page_id: P20261023212000DESIGN02
        text_content: |-
          Applying Don Norman to Supernote Web UI (Q4 Cloud Release)
          - Show exact upcoming notebook filenames before running wiki backfill
          - Provide live progress bar + Stop button for multi-chunk runs
          - Separate calm informational lint notices from actionable warnings

