  - file_name: Monthly_Reflections_2026.note
    description: Monthly reflections reviewing wins, energy drains, and adjustments.
    pages:
      - page_index: 0
        page_id: P20260930080000MREFL0001
        text_content: |-
          SEPTEMBER 2026 — MONTHLY REFLECTION
          What Went Well:
          - Built consistent 4x/week trail running base for Marin Half Marathon.
          - Family dinners 5 nights/week with Mel, Leo, and Sam.

          What Drained Energy:
          - Juggling 6+ home and work side-projects at once — felt scattered and finished none.
          - Checking work Slack and email after 9pm wrecked sleep quality.

          Adjustments for October:
          - Start reading Four Thousand Weeks; pick at most 3 major active projects.
          - Leave phone charging in kitchen at 9pm every night.
          - Protect Sunday mornings for trail runs + family breakfast.
      - page_index: 1
        page_id: P20261031080000MREFL0002
        text_content: |-
          OCTOBER 2026 — MONTHLY REFLECTION
          What Went Well:
          - Narrowed focus to 3 big projects: Marin Half, Solar/Powerwall, Kitchen Backsplash.
          - Leo & Sam loved starting FIRST LEGO League robotics with Coach Priya.
          - Switching to Brooks Cascadia 18 + foam rolling fixed nagging left knee.

          What Drained Energy:
          - Pushy sales calls (SunRun felt high-pressure; glad we trusted gut and went local with Pacific Solar).
          - Still slipped on 9pm phone rule half the month (14/31 days).

          Lessons & Adjustments for November:
          - Keeping a strict 3-project cap actually made decisions faster (subway tile + warm gray grout settled in 1 week).
          - Double down on 9pm phone-in-kitchen rule before race week.
