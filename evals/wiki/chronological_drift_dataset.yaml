    text_content: 'Project FieldNote — Architecture Overview

      - Tech Lead: Devon

      - Primary database: PostgreSQL on AWS RDS ($420/mo estimated)

      - Authentication: Auth0 managed SaaS ($300/mo)

      - Mobile client: React Native (shared TypeScript codebase)

      - Target v1.0 launch: June 1'
