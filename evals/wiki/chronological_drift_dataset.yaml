    page_id: P20260122090000FN0102
    text_content: 'FieldNote Sync Engine Design

      - Devon designed React Native SQLite bridge for local caching.

      - PgBouncer connection pooler in front of AWS RDS for sync workers.

      - Auth0 JWT refresh tokens stored in iOS Keychain.'
  - page_index: 2
    page_id: P20260205090000FN0103
    text_content: 'FieldNote Schema Notes

      - Postgres JSONB columns for note metadata and sync cursors.

      - Estimated RDS storage growth: 40GB/year for 5,000 beta users.'
  - page_index: 3
    page_id: P20260218090000FN0104
    text_content: 'FieldNote Beta Checklist

      - Finish Auth0 social login screens in React Native.

      - Load test RDS write throughput before June 1 beta.'
