  - file_name: ML_Reading_Seminar.note
    description: Handwritten reading group and seminar notes on LLM quantization, KV-cache compression, retrieval evaluation pitfalls, synthetic data, and VLM OCR.
    pages:
      - id: work_ml_p0
        page_index: 0
        page_id: P20260130120000hJ5kL8pO2iUy
        keywords:
          - quantization
          - must-read
        text_content: |-
          2026-01-30 - Seminar #1: Weight-Only vs W8A8 Activation Quantization (Lin presenting)
          - SmoothQuant + AWQ recap: salient activation channels (~0.1-1% of dims) have 20-100x magnitude outliers
          - Naive per-tensor int8 crushes accuracy on >7B models because outliers stretch step size
          - AWQ scales salient weights up before W4 group quantization (g=128) -> <0.4 ppl drop on Llama-3-8B
          - Hardware catch: W4A16 is great at batch=1 (memory-bandwidth bound), but loses advantage around batch >= 32 where dequant overhead hits compute units
          - For our embedding/reranker service (batch 16-64 on L4 GPUs), FP8 or W8A8 int8 TensorCore beats W4A16 throughput by ~1.6x
      - id: work_ml_p1
        page_index: 1
        page_id: P20260313121500tR4eW7qA1sDf
        keywords: []
        text_content: |-
          2026-03-13 - Seminar #4: Long-Context `kv-cahce` Memory Math & PagedAttention
          - Quick back-of-envelope for 70B GQA (8 KV heads, d_head=128, 80 layers, fp16):
            2 * 80 * 8 * 128 * 2 bytes = 327,680 bytes (~320 KB) per token!
          - At 32k context, 1 sequence = ~10.2 GB just for KV state (weights alone ~140 GB fp16 / ~38 GB int4)
          - Fragmentation waste without paging was 60-70%; vLLM block table (16 tok/block) drops waste < 4%
          - KV int4/fp8 quantization w/ per-token K scaling + per-channel V scaling saves 2-4x VRAM
          - Watch out: Needle-in-a-Haystack stays 99%, but multi-hop citation recall degrades first under aggressive KV eviction (H2O / StreamingLLM)
      - id: work_ml_p2
        page_index: 2
        page_id: P20260508120000gH8jK2lP5oIu
        keywords:
          - evaluation
          - must-read
        text_content: |-
          2026-05-08 - Seminar #7: IR & RAG Evaluation Pitfalls on Messy Personal Corpora
          - BEIR / MS-MARCO benchmarks overestimate dense bi-encoder quality on personal notes!
          - Why notes are weird:
            1) Heavy shorthand, dates, ticket codes (`PLAT-904`), people's first names
            2) High lexical overlap across weekly recurring 1:1 pages -> dense embeddings collapse them together
            3) Incomplete pooling bias: judging only top-10 from baseline misses lexical-only or semantic-only hits
          - Takeaway for our internal eval: construct graded relevance (0..3) w/ human-written queries BEFORE looking at retriever outputs
          - Always report nDCG@5 + MRR + Recall@10 side-by-side; check zero-hit abstention precision too
      - id: work_ml_p3
        page_index: 3
        page_id: P20260626121000yU3iO6pA9sDf
        keywords: []
        text_content: |-
          2026-06-26 - Seminar #10: Synthetic Query Generation & Model Collapse Risks
          - Paper discussion: using frontier LLMs to synthesize domain queries for retriever fine-tuning (Promptagator / InPars v2)
          - Failure mode we reproduced: LLM copies rare 3-word phrases verbatim from passage -> student model learns lazy lexical matching!
          - Fix: persona + intent conditioning + forbid >=3-gram exact spans from target doc during generation
          - Also filter w/ cross-encoder consistency check (keep pairs where target is in top-3 of teacher)
          - Cost math: generating 50k filtered hard-negative triples w/ open 32B model on 4x A100 took ~6 hrs (~$42)
          - Never replace human test set w/ synthetic queries—only use synthetic for train/dev!
      - id: work_ml_p4
        page_index: 4
        page_id: P20260814120500bN7mV4cX1zQw
        keywords:
          - vlm
          - ocr
        text_content: |-
          2026-08-14 - Seminar #13: Vision-Language Models for Handwritten Ink & Diagrams
          - Tested Qwen2-VL-7B vs Florence-2 + dedicated stroke recognizer on e-ink PNG exports (1404x1872 px)
          - Naive ViT tiling downsamples thin 0.3mm pen strokes -> `0` vs `O`, `1` vs `l`, and `rn` vs `m` confusions spike
          - Dynamic high-res patching (tiling up to 4x4 sub-crops) boosts character accuracy from 88.4% -> 96.7%, but visual tokens jump 256 -> 2,300/page!
          - Hallucination trap: VLMs silently "autocorrect" domain acronyms or invent plausible bullet endings on messy cursive
          - Hybrid win: keep stroke-level HWR engine for faithful text + lightweight VLM pass only on boxed diagrams/tables
      - id: work_ml_p5
        page_index: 5
        page_id: P20261002120000kL9mN3bV6cXz
        keywords: []
        text_content: |-
          2026-10-02 - Seminar #16: Matryoshka Embeddings & Binary/Int8 Vector Indexing
          - MRL (Matryoshka Representation Learning) trains nested prefixes (d=1024 -> 512 -> 256 -> 128) w/ multi-scale InfoNCE loss
          - Truncating 1024d float32 -> 256d int8 cuts vector index RAM by 16x! (4 KB/chunk -> 256 bytes/chunk)
          - Two-stage funnel experiment on 1M note chunks:
            Stage 1: 256d binary/int8 retrieve top-100 (~1.8ms CPU SIMD, zero GPU)
            Stage 2: rescore top-100 w/ full int8 vectors + BM25 RRF fusion (~3.5ms)
          - Retained 98.6% of full 1024d fp32 Recall@10!
          - Huge product implication: per-user encrypted vector index is small enough to cache in memory on cheap CPU nodes
      - id: work_ml_p6
        page_index: 6
        page_id: P20261113121500fG2hJ5kL8zXc
        keywords:
          - hardware
          - latency
        text_content: |-
          2026-11-13 - Seminar #19: CPU vs L4 GPU Inference Economics for Multi-Tenant Search
          - Benchmarked query-time embedding (384d / 512-tok max) for interactive search budget (< 35ms p99):
            - ONNX Runtime int8 AVX-512 on c7i.2xlarge: p50 6.2ms, p99 14.8ms up to 90 QPS ($0.34/hr)
            - NVIDIA L4 GPU w/ Triton dynamic batching (max delay 3ms): p50 4.1ms, p99 11.0ms up to 650 QPS ($0.81/hr)
          - Surprise bottleneck: tokenizer + Python JSON serialization ate 2.8ms before switching to Rust `tokenizers` over gRPC
          - Bulk notebook indexing is embarrassingly async -> run on spot L4s overnight; serve live user queries on CPU pods to avoid GPU cold-start/availability headaches in DR region!
  - file_name: Security_And_Compliance.note
    description: Security engineering and compliance notes on OAuth/OIDC, KMS key rotation, SOC2 audit evidence, webhook HMAC signing, tabletop exercises, and vendor reviews.
    pages:
      - id: work_sec_p0
        page_index: 0
        page_id: PLEGACY_WORK_SEC_P0
        keywords: []
        text_content: |-
          2026-01-10 - Imported Legacy Note: KMS Envelope Encryption Hierarchy
          - Root trust: AWS KMS CMK (`alias/prod-vault-root-v1`) -> never leaves HSM
          - Per-organization DEK (AES-256-GCM) generated on workspace creation, stored wrapped (`encrypted_dek` bytea in `org_keys`)
          - Each notebook blob gets fresh 96-bit random nonce + AAD bound to `(org_id, notebook_id, chunk_sha256)`
          - Why AAD matters: prevents malicious or buggy storage worker from swapping ciphertext blob between two tenant paths!
          - DEK cache in memory capped at 5 min TTL; wiped immediately on org offboarding event
      - id: work_sec_p1
        page_index: 1
        page_id: P20260226110000wQ4eR7tY1uIo
        keywords:
          - oauth
          - blocker
        text_content: |-
          2026-02-26 - Desktop & Tablet `0Auth` 2.1 + PKCE Threat Review
          - Native companion apps cannot safely hold a `client_secret` -> require S256 PKCE on all `/oauth/authorize` flows
          - Found gap in legacy tablet pairing: refresh tokens were non-rotating w/ 180-day lifetime!
          - New policy (SEC-305):
            1) Refresh token rotation on every exchange + reuse detection (if old RT replayed -> revoke entire token family)
            2) Bind session metadata to device hardware fingerprint + user-visible device list in Settings
            3) Narrow API token scopes: `notes:read`, `notes:write`, `webhooks:manage`, `org:admin`
          - Coordinate rollout w/ companion app v2.8 so old clients get graceful re-auth prompt
      - id: work_sec_p2
        page_index: 2
        page_id: P20260416143000aZ5sX8dC2vBn
        keywords: []
        text_content: |-
          2026-04-16 - Outbound Webhook HMAC Signing & Replay Protection Spec
          - Enterprise customers integrating w/ internal ERPs need cryptographic authenticity on webhook POSTs
          - Header format:
            `X-Supernote-Signature: t=1776349800,v1=<hex_hmac_sha256>`
          - Signed payload string: `f"{timestamp}.{raw_request_body_bytes}"` (never re-serialize parsed JSON!)
          - Recommended verifier tolerance: reject if `abs(now - t) > 300s` to block replay capture
          - Rotation gap flagged by Dan: right now orgs only have 1 active `whsec_...` secret -> rotating breaks integrations during deploy
          - Need dual-secret overlap (`v1=<sig_new>,v1=<sig_old>`) w/ configurable 24h-7d expiration window
      - id: work_sec_p3
        page_index: 3
        page_id: P20260618101500mJ7nH4bG1vFc
        keywords:
          - audit-evidence
          - soc2
        text_content: |-
          2026-06-18 - SOC2 Type II Observation Window Prep (Auditor: Schellman)
          - Observation period closes Aug 31; bridge letter needed for Q3 enterprise pipeline (Vanguard, Kestrel)
          - Missing / shaky evidence items:
            1) CC6.2 Quarterly access review: 2 ex-contractors still had read access to staging Sentry (revoked today, document ticket SEC-371!)
            2) CC7.3 Incident response test: must run + document annual tabletop exercise before July 31
            3) CC8.1 Change management: 3 hotfix commits in Jan incident bypassed 2-approver rule -> attach postmortem PLAT-904 exception sign-off
          - Automate GitHub branch protection + AWS IAM config snapshots via daily cron into `s3://sec-audit-worm-2026`
      - id: work_sec_p4
        page_index: 4
        page_id: P20260723153000pL2oK5iJ8uHy
        keywords: []
        text_content: |-
          2026-07-23 - Annual Security Tabletop Exercise: Compromised CI Runner Token
          - Attendees: Dan (Sec), Elena (Platform), Priya, Nora (Product/Comms), Legal counsel
          - Scenario injected: malicious transitive npm dependency in docs preview job exfiltrates short-lived AWS OIDC deploy role
          - Good news: prod DB & KMS keys isolated in separate AWS account (`prod-core`), CI role only had ECR push + staging ECS deploy
          - Gap 1: took 28 mins to figure out which GitHub Actions workflow minted the STS session (`SourceIdentity` tag wasn't set!)
          - Gap 2: customer status page + legal notification draft assumed 72h GDPR window, but Kestrel MSA asks for 24h notice on confirmed breach
          - Action items: enforce `sts:SourceIdentity` on all OIDC trust policies + pin GitHub Actions by full commit SHA (SEC-398)
      - id: work_sec_p5
        page_index: 5
        page_id: P20260929132000qW9eR6tY3uIo
        keywords:
          - vendor-review
          - escalation
        text_content: |-
          2026-09-29 - Vendor Security Review: Hosted Embedding / Reranker API vs Self-Hosted
          - Evaluated external inference vendor ("VectorCloud AI") for Q4 semantic search beta
          - Red flags in their security packet:
            1) Default 30-day abuse-monitoring payload log retention unless on $5k/mo Enterprise BAA tier
            2) Subprocessor list includes 2 shared GPU cloud providers w/o SOC2 Type II
            3) Cannot cryptographically bind tenant ACLs inside their hosted index
          - Recommendation (APPROVED by Dan + CTO): REJECT third-party inference API for customer notes
          - Run open-weight embedding model entirely inside our VPC (CPU/L4 pods, zero payload logging, existing KMS boundary)
      - id: work_sec_p6
        page_index: 6
        page_id: P20261030111000zX8cV5bN2mLk
        keywords:
          - audit-evidence
        text_content: |-
          2026-10-30 - SEC-412 Sign-off: Multi-Region KMS Key Policy for `us-east-2` DR
          - Unblocked Elena's Aurora Global + S3 CRR Terraform after tightening multi-region key (`mrk-9941a8...`) policy:
            - Replica key in `us-east-2` denies `kms:Decrypt` to standard app roles unless `dr_failover_active` IAM session tag is asserted by break-glass runbook
            - Replication service principal restricted via `aws:SourceArn` + `kms:ViaService` conditions
          - Verified CloudTrail logs both regions into central immutable security account
          - Annual CMK backing-key auto-rotation enabled (`EnableKeyRotation: true`); wrapped tenant DEKs remain valid across key versions
          - Ready for Nov DR failover game day!
