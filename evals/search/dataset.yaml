  - file_name: Book_And_History_Notes.note
    description: Reading notes on Late Bronze Age Mediterranean collapse, behavioral economics, urban mobility, Stoicism, and espresso chemistry
    pages:
      - id: life_books_p0
        page_index: 0
        page_id: P20251123211504kL2zX5cV8bNm
        keywords:
          - bronze-age
        text_content: |-
          2025-11-23 - Eric Cline, "1177 B.C.: The Year Civilization Collapsed" (Rev. Ed.)
          Core thesis: NOT a single villain ("Sea Peoples"), but a "systems collapse" of hyper-connected palace economies around 1200-1150 BCE.
          - Tin + copper network fragility: bronze needed ~90% Cu (Cyprus) + ~10% Sn hauled all the way from Badakhshan (Afghanistan) or Cornwall!
          - Uluburun shipwreck (~1300 BCE) proves staggeringly cosmopolitan gift/trade exchange: 10 tons Cypriot copper, 1 ton tin, Canaanite jars, Baltic amber, Egyptian gold scarab of Nefertiti.
          - Multipliers: 300-yr megadrought (pollen cores in Cyprus/Syria), earthquake storm along Aegean faults, internal peasant revolts at Mycenae/Ugarit cutting off grain & tin routes simultaneously.
      - id: life_books_p1
        page_index: 1
        page_id: P20260117220538oP5aS8dF1gHj
        keywords:
          - reread
        text_content: |-
          2026-01-17 - Kahneman ("Thinking, Fast and Slow") & Thaler on Financial Heuristics
          Notes connecting cognitive biases to how we make real household & investing decisions:
          - Mental Accounting: treating a $2,000 tax refund or credit-card sign-up bonus as "house money" while agonizing over a $40 tool purchase -> dollars are fungible!
          - Anchoring + Loss Aversion (~2x pain vs equivalent gain): holding a losing stock or refusing to lock a 5.5% mortgage refi because you anchor to 2021's anomalous 2.8% rates.
          - Planning Fallacy: home renovation & woodshop time estimates always assume best-case path; apply "outside view" reference-class multiplier (1.6x time, 1.25x cost).
      - id: life_books_p2
        page_index: 2
        page_id: PLEGACY_LIFE_BOOKS_P2
        keywords: []
        text_content: |-
          Marcus Aurelius, "Meditations" (Hays translation, Books II, IV & V)
          - IV.3: "People look for retreats for themselves, in the country, by the coast, or in the hills... Nowhere can a person find a quieter or more untroubled retreat than in his own mind."
          - Dichotomy of control (via Epictetus): separate external shock (hail branch hitting garage, delayed flight, market drawdown) from our second-arrow judgment ("this ruined my week").
          - Book V.1 on getting out of bed when unmotivated: we were built for cooperative work, not just staying warm under blankets—pair duty w/ gentleness toward irritable coworkers.
          - View from above: zoom out in space and deep time (Bronze Age palaces -> dust) to shrink petty status anxiety.
      - id: life_books_p3
        page_index: 3
        page_id: P20260429214019eR7tY0uI3oPa
        keywords: []
        text_content: |-
          2026-04-29 - Urban Transit, Protected Bike Networks & Dutch CROW Design Principles
          Reading "Curbing Traffic" (Bruntlett) + Jarrett Walker's "Human Transit":
          - Frequency IS freedom: a bus/tram every 7-8 mins builds spontaneous ridership; 45-min headways require schedule memorization and kill network transfers.
          - Painted bike gutters next to 35 mph arterials only serve the "strong & fearless" ~4% -> continuous Dutch kerbs, raised crosswalks at side streets, and tight corner radii bring out 8-to-80 yr olds.
          - Modal filtering (diagonal diverters on residential grids): lets bikes/peds/fire trucks pass through while routing cut-through car commuters back onto boulevards -> noise drops 6-10 dB.
      - id: life_books_p4
        page_index: 4
        page_id: P20260611202544sD4fG7hJ0kLz
        keywords:
          - espresso
        text_content: |-
          2026-06-11 - Jonathan Gagné, "The Physics of Filter Coffee" + Espresso Water Chemistry
          Why city tap water vs RO matters so much for extraction & boiler scale:
          - General Hardness (GH: Mg2+ & Ca2+) pulls flavor compounds; Alkalinity (KH: HCO3- bicarbonate buffer) neutralizes organic fruit acids!
          - High KH (>70 ppm as CaCO3) makes washed Ethiopian/Colombian roasts taste flat, chalky, muted; zero KH tastes sour/battery-acid.
          - DIY Hendon / RPavlis / Barista Hustle lotus drops recipe in 1 gal distilled water:
            * Target ~55 ppm GH (mostly MgSO4 Epsom salt) + ~25 ppm KH (potassium bicarbonate -> zero scale in espresso thermoblock!).
            * Turbo shot experiment on light roast: 18g in -> 45g out in 17 sec @ 6 bar = sweeter & more consistent than 9-bar 30s!
      - id: life_books_p5
        page_index: 5
        page_id: P20260912215016cV6bN9mQ2wEr
        keywords: []
        text_content: |-
          2026-09-12 - Edo-Period Urbanism & Japanese Joinery Reading Prep
          Notes from "Just Enough: Lessons in Living Green from Traditional Japan" (Azby Brown) + Seike's "The Art of Japanese Joinery":
          - Edo (~1750, pop >1 million) ran a closed-loop circular economy: nightsoil auctioned by landlords to suburban daikon farmers for silver; ash buyers supplied dye houses & potteries; zero timber wasted.
          - Tsugite (lengthening joints) & Shiguchi (framing joints): wood houses flex as damped pendulums during earthquakes rather than snapping rigid iron fasteners (just like Kyoto machiya beams!).
          - Kanna (pull plane) slices wood fibers cleanly -> leaves burnished surface that sheds rain without varnish.
      - id: life_books_p6
        page_index: 6
        page_id: P20261118213507yU1iO4pA7sDf
        keywords: []
        text_content: |-
          2026-11-18 - Fernand Braudel & Cyprian Broodbank ("The Making of the Middle Sea")
          How geography & wind regimes shaped Mediterranean connectivity long before Rome:
          - Three rhythms of history (Braudel): la longue durée (mountains, currents, seasonal transhumance), conjonctures (demographic/price cycles), and mere surface "events" (battles, treaties).
          - Counterclockwise currents + summer northern Etesian (Meltemi) winds made sailing Crete -> Egypt easy, while returning north forced ships to hug the Levantine & Anatolian coast past Ugarit and Cyprus!
          - Olive + vine + barley triad + maritime cabotage turned fragmented micro-ecologies into risk-sharing insurance against localized rain failure.
