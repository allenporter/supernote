  - file_name: 2026_Platform_Eng_Notes.note
    description: Distributed systems architecture, storage and queue debugging, incident notes, caching trade-offs, and on-call handoffs across 2026.
    pages:
      - id: work_eng_p0
        page_index: 0
        page_id: P20260114093000xK8mP2vL9nQz
        keywords:
          - postmortem
          - kafka
        text_content: |-
          2026-01-14 - Billing Consumer Lag Spike (SEV-2)
          - Alert fired 03:18 UTC: consumer group `billing-rollup-v2` lag > 1.4M msgs
          - Root trigger: partition rebalance loop after deploy #4812 bumped `max.poll.records` 200 -> 1000
          - Downstream ledger RPC p99 jumped 85ms -> 640ms, tripped 30s poll timeout
          - Temp fix w/ Priya: rolled back env var + paused replay worker on shard-03
          - RSS on worker pods peaked ~3.7 GB (limit 4Gi) right before OOMKill
          - Next: cap batch bytes at 2MB + move idempotency check to local RocksDB state
          - Ref issue PLAT-904 / PR #4819
      - id: work_eng_p1
        page_index: 1
        page_id: P20260219141500bR4tY7uJ1wXe
        keywords: []
        text_content: |-
          2026-02-19 - Primary DB Autovacuum & Bloat Debugging
          - `events_outbox` table hit 420 GB on `postgresq1` primary (dead tuples ~68%)
          - Long-running analytics read txn from Metabase held xmin horizon for 6h 40m
          - Checkpointer write spikes causing p95 insert stall ~190ms every 5 min
          - Tuned table storage params:
            autovacuum_vacuum_scale_factor = 0.01
            autovacuum_vacuum_cost_limit = 2400
          - Set `idle_in_transaction_session_timeout = 5min` on reporting role
          - Need to route BI queries to read replica `pg-ro-usw2-02` by end of Feb
      - id: work_eng_p2
        page_index: 2
        page_id: P20260403110500mN6pQ9sV3cZa
        keywords:
          - architecture
          - decision-needed
        text_content: |-
          2026-04-03 - Object Storage Tiering & Chunk Dedup Sketch
          - Current S3 Standard spend ~$38k/mo for raw sync blobs (approx 610 TB)
          - 74% of blobs untouched after day 14, except re-index sweeps
          - Option A: S3 Intelligent-Tiering -> zero code change, monitoring fee on small objects (<128KB hurts us!)
          - Option B: pack small deltas into 16MB tar-zstd segments + lifecycle to Glacier IR at 30d
          - Marcus pointed out compaction job needs lease lock in etcd so 2 workers don't double-pack
          - Est savings ~$14.5k/mo if we compact objects < 64KB first
          - Prototype segment reader in PR #5102 before Q2 infra budget lock
      - id: work_eng_p3
        page_index: 3
        page_id: P20260521164000dF2gH5jK8lPo
        keywords: []
        text_content: |-
          2026-05-21 - Redis Cluster Stampede on Session Metadata
          - Saw 42k req/s spike on hot key `org_cfg:9921` when enterprise tenant ran bulk CLI import
          - Single shard CPU pegged at 98%, cross-slot pipeline calls timed out in auth-proxy
          - Quick mitigation: 15s in-process TinyLFU cache w/ jittered TTL (12-18s)
          - Also adding singleflight coalescing in Go gateway (`pkg/cache/loader.go`)
          - Memory check: 50k entries * ~1.2KB = ~60MB per gateway pod -> totally fine
          - Double-check revocation SLA w/ SecEng: is 15s stale org permission acceptable?
          - Tracking under PLAT-1138
      - id: work_eng_p4
        page_index: 4
        page_id: P20260709100000qW3eR6tY9uIo
        keywords:
          - oncall
          - follow-up
        text_content: |-
          2026-07-09 - Primary On-Call Handoff (Dev -> Elena)
          - Quiet weekend overall, 3 pages total (2 noisy disk alerts on build runners)
          - Watch item 1: `search-indexer` queue depth creeps up around 14:00 UTC daily sync wave
          - Watch item 2: gRPC keepalive mismatch w/ Envoy 1.31 upgrade in staging (`ENHANCE_YOUR_CALM`)
          - Do NOT merge PR #5488 until schema migration `20260708_add_shard_epoch` finishes backfilling
          - Backfill at 81% as of 09:45, ETA ~3 hrs at 5k rows/sec throttle
          - If EU webhook workers flap again, drain node `ip-10-42-18-91` (suspect bad NIC)
          - Pager rotation swap confirmed for July 16
      - id: work_eng_p5
        page_index: 5
        page_id: P20260827152000zX1cV4bN7mLk
        keywords: []
        text_content: |-
          2026-08-27 - Tail Latency Deep Dive: Sync Commit Path
          - End-to-end p99 commit is 410ms (target < 220ms for Q3 reliability goal)
          - Trace breakdown (Honeycomb sample n=12,000):
            1) TLS + auth token introspection: 38ms
            2) Postgres serializable manifest check: 165ms (contention on `folder_rev` index)
            3) Synchronous webhook fanout enqueue: 112ms
            4) Blob checksum verify: 95ms
          - Why are we hashing SHA-256 twice?! Proxy already computes digest on stream upload
          - Switching manifest lock to optimistic version counter (`WHERE rev = $expected`) cut step 2 -> 29ms in bench
          - Move webhook enqueue to transactional outbox poller
      - id: work_eng_p6
        page_index: 6
        page_id: P20261006113000pL9oK6iJ3uHy
        keywords:
          - blocker
          - q4-planning
        text_content: |-
          2026-10-06 - Q4 Infra Capacity & Multi-Region DR Sizing
          - Finance asked to keep Q4 AWS incremental spend under +$18k/mo
          - Active-passive `us-east-2` warm standby needs:
            - Cross-region Aurora global replica (~$4.8k/mo + replication IO)
            - S3 CRR for encrypted customer vaults (~$7.2k/mo egress + PUTs)
            - Minimal EKS control + 3x m7g.xlarge core nodes (~$1.9k/mo)
          - Total ~$13.9k/mo -> fits budget IF we skip Kafka MirrorMaker for raw telemetry topics
          - Open blocker: KMS multi-region key policy needs security sign-off (see SEC-412)
          - Target RPO < 60s, RTO < 20 min for Tier-0 metadata
      - id: work_eng_p7
        page_index: 7
        page_id: P20261112171000gT5rF8eD2wSq
        keywords: []
        text_content: |-
          2026-11-12 - Webhook Delivery Retry Storm Debugging
          - Partner endpoint (`acme-erp.io`) returned 502s for 45 mins, queued 380k retries
          - Our exponential backoff lacked jitter -> synchronized thundering herd every 8m
          - Worse: slow 10s connect timeout starved shared worker pool for healthy tenants!
          - Design fix w/ Sam:
            - Per-tenant concurrency semaphore (max 12 in-flight deliveries/org)
            - Full jitter backoff + automatic circuit breaker after 50 consecutive 5xx
            - Separate "fast lane" queue vs "retry lane" queue in SQS
          - Ship behind flag `webhook_bulkhead_v2` on Monday (PR #5931)
  - file_name: Product_Strategy_2026.note
    description: Quarterly roadmap reviews, customer discovery interviews, pricing and packaging debates, funnel metrics, and launch readiness.
    pages:
      - id: work_prod_p0
        page_index: 0
        page_id: P20260122103000aS4dF7gH1jKl
        keywords:
          - roadmap
        text_content: |-
          2026-01-22 - H1 Product Roadmap Trade-offs w/ Exec Team
          - Core tension: Enterprise admin controls (SSO, audit log export) vs Self-serve collaborative spaces
          - ARR math from Nora: 9 mid-market deals ($420k pipeline) gated on SAML + SCIM
          - Meanwhile self-serve weekly active teams grew 14% MoM in Dec w/ zero paid acquisition
          - Agreed split: 65% eng capacity on Enterprise Trust track, 35% on Activation/Sharing
          - Punting custom workflow templates + mobile offline annotations to Q3
          - Need crisp positioning so Pro tier doesn't feel abandoned while we build Enterprise
      - id: work_prod_p1
        page_index: 1
        page_id: P20260305150000zM8nB5vC2xQw
        keywords: []
        text_content: |-
          2026-03-05 - User Interviews Synthesis: Research Leads (6 sessions)
          - P1 (BioTech PM): dumps PDFs + handwritten lab notes in 1 folder, gives up searching after 20+ files
          - P3 (Staff UX Researcher): "I remember WHEN I wrote it (after client workshop) + roughly a diagram, not exact title"
          - P4 & P6 both keep a separate Notion index manually linking back to notebooks -> huge friction!
          - Surprising takeaway: nobody asked for AI auto-summaries; 5 of 6 wanted fast cross-notebook search + saved filters
          - Direct quote (P5): "Don't rewrite my messy bullets, just find the page from Tuesday's vendor call."
          - Share clips w/ Design before Friday wireframe crit
      - id: work_prod_p2
        page_index: 2
        page_id: P20260428134500eR7tY4uI9oPa
        keywords:
          - pricing
          - decision-needed
        text_content: |-
          2026-04-28 - Packaging & Seat Model Debate (Pro vs Team vs Enterprise)
          - Current pain: Team plan at $18/seat/mo includes unlimited OCR + storage -> power users cost us ~$6.40/mo in GPU/S3!
          - Finance wants usage-based credit pack; Design + Sales hate unpredictable bills
          - Proposal on whiteboard:
            - Pro ($12): 1 user, 50 GB sync, standard search
            - Team ($20/seat, min 3): shared vaults, guest read links, 250 GB pooled + webhook integrations
            - Enterprise ($38/seat): SSO/OIDC, 7-yr audit retention, customer-managed keys, SLA
          - Grandfather existing Team cohorts for 12 mos to avoid churn spike
      - id: work_prod_p3
        page_index: 3
        page_id: P20260611091500kL3jH6gF9dSa
        keywords: []
        text_content: |-
          2026-06-11 - Self-Serve `onboaridng` Funnel Drop-off Review
          - May cohort (n=8,420 signups):
            Signup -> Device paired: 68%
            Paired -> First notebook synced: 54%
            First sync -> Day-7 repeat sync: 31% (down from 37% in Q1!)
          - Segmenting by OS: macOS companion app users convert 2.1x higher than web-only uploaders
          - Biggest drop: Wi-Fi sync token screen times out after 90s while user hunts for tablet settings menu
          - Quick wins for Sprint 14: QR code pairing flow + extend pairing code TTL to 10 min
          - Target: lift Day-7 retained sync back above 38% by Aug 1
