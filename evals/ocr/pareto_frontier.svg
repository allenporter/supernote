<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="OCR Accuracy vs Latency Pareto Frontier">
  <style>
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .plot-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3 3; }
    .title { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
    .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
    .panel-title { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; }
    .axis-label { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
    .tick { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
    .frontier-step { fill: none; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .frontier-line { fill: none; stroke: #2563eb; stroke-width: 2.5; }
    .leader { stroke: #cbd5e1; stroke-width: 1; }
    .pt-pareto { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
    .pt-dom { fill: #94a3b8; stroke: #ffffff; stroke-width: 1.5; }
    .lbl-pareto { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
    .lbl-dom { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0f172a; stroke: #334155; }
      .plot-bg { fill: #1e293b; stroke: #334155; }
      .grid { stroke: #334155; }
      .title, .panel-title, .lbl-pareto { fill: #f8fafc; }
      .subtitle, .axis-label, .tick, .lbl-dom { fill: #94a3b8; }
      .frontier-step { stroke: #1d4ed8; }
      .frontier-line { stroke: #60a5fa; }
      .leader { stroke: #475569; }
      .pt-pareto { fill: #60a5fa; stroke: #0f172a; }
      .pt-dom { fill: #64748b; stroke: #0f172a; }
    }
  </style>
  <rect x="1" y="1" width="958" height="398" rx="12" class="card" />
  <text x="24" y="30" class="title">OCR Quality vs. Latency Pareto Frontier (supernote-ocr-suite-v1, 30 pages)</text>
  <text x="24" y="48" class="subtitle">Solid blue = Pareto-optimal (non-dominated); gray = dominated.</text>
<text x="64.0" y="80.0" class="panel-title">1. Transcript Capture (Word F1)</text>
<rect x="64.0" y="94.0" width="396.0" height="254.0" class="plot-bg" rx="6" />
<line x1="64.0" y1="322.0" x2="460.0" y2="322.0" class="grid" />
<text x="56.0" y="326.0" text-anchor="end" class="tick">0%</text>
<line x1="64.0" y1="271.5" x2="460.0" y2="271.5" class="grid" />
<text x="56.0" y="275.5" text-anchor="end" class="tick">25%</text>
<line x1="64.0" y1="221.0" x2="460.0" y2="221.0" class="grid" />
<text x="56.0" y="225.0" text-anchor="end" class="tick">50%</text>
<line x1="64.0" y1="170.5" x2="460.0" y2="170.5" class="grid" />
<text x="56.0" y="174.5" text-anchor="end" class="tick">75%</text>
<line x1="64.0" y1="120.0" x2="460.0" y2="120.0" class="grid" />
<text x="56.0" y="124.0" text-anchor="end" class="tick">100%</text>
<line x1="103.9" y1="94.0" x2="103.9" y2="348.0" class="grid" />
<text x="103.9" y="366.0" text-anchor="middle" class="tick">100 ms</text>
<line x1="177.1" y1="94.0" x2="177.1" y2="348.0" class="grid" />
<text x="177.1" y="366.0" text-anchor="middle" class="tick">300 ms</text>
<line x1="257.4" y1="94.0" x2="257.4" y2="348.0" class="grid" />
<text x="257.4" y="366.0" text-anchor="middle" class="tick">1 s</text>
<line x1="330.6" y1="94.0" x2="330.6" y2="348.0" class="grid" />
<text x="330.6" y="366.0" text-anchor="middle" class="tick">3 s</text>
<line x1="410.9" y1="94.0" x2="410.9" y2="348.0" class="grid" />
<text x="410.9" y="366.0" text-anchor="middle" class="tick">10 s</text>
<text x="262.0" y="384.0" text-anchor="middle" class="axis-label">Median Page Latency (log scale, lower is faster)</text>
<text x="26.0" y="221.0" text-anchor="middle" transform="rotate(-90 26.0 221.0)" class="axis-label">Mean Word F1</text>
<polyline points="119.2,286.1 198.1,286.1 198.1,173.2 251.0,173.2 251.0,169.4 268.4,169.4 268.4,122.1 383.4,122.1 383.4,120.5" class="frontier-step" />
<polyline points="119.2,286.1 198.1,173.2 251.0,169.4 268.4,122.1 383.4,120.5" class="frontier-line" />
<circle cx="119.2" cy="286.1" r="6.0" class="pt-pareto" />
<circle cx="198.1" cy="173.2" r="6.0" class="pt-pareto" />
<circle cx="251.0" cy="169.4" r="6.0" class="pt-pareto" />
<circle cx="268.4" cy="122.1" r="6.0" class="pt-pareto" />
<circle cx="383.4" cy="120.5" r="6.0" class="pt-pareto" />
<circle cx="410.4" cy="127.1" r="5.0" class="pt-dom" />
<text x="129.2" y="290.1" text-anchor="start" class="lbl-pareto">Apple Vision Fast (17.8%)</text>
<text x="194.1" y="193.2" text-anchor="start" class="lbl-pareto">Apple Vision Accurate (73.7%)</text>
<text x="261.0" y="173.4" text-anchor="start" class="lbl-pareto">Supernote On-Device (75.5%)</text>
<text x="258.4" y="126.1" text-anchor="end" class="lbl-pareto">Gemini 3.5 Flash-Lite (99.0%)</text>
<text x="387.4" y="108.5" text-anchor="end" class="lbl-pareto">Gemini 3.6 Flash (99.7%)</text>
<text x="414.4" y="147.1" text-anchor="end" class="lbl-dom">Gemini 3.8 Flash (96.5%)</text>
<text x="536.0" y="80.0" class="panel-title">2. Handwritten Rapid Logging (BuJo Symbol Recall)</text>
<rect x="536.0" y="94.0" width="396.0" height="254.0" class="plot-bg" rx="6" />
<line x1="536.0" y1="322.0" x2="932.0" y2="322.0" class="grid" />
<text x="528.0" y="326.0" text-anchor="end" class="tick">0%</text>
<line x1="536.0" y1="271.5" x2="932.0" y2="271.5" class="grid" />
<text x="528.0" y="275.5" text-anchor="end" class="tick">25%</text>
<line x1="536.0" y1="221.0" x2="932.0" y2="221.0" class="grid" />
<text x="528.0" y="225.0" text-anchor="end" class="tick">50%</text>
<line x1="536.0" y1="170.5" x2="932.0" y2="170.5" class="grid" />
<text x="528.0" y="174.5" text-anchor="end" class="tick">75%</text>
<line x1="536.0" y1="120.0" x2="932.0" y2="120.0" class="grid" />
<text x="528.0" y="124.0" text-anchor="end" class="tick">100%</text>
<line x1="575.9" y1="94.0" x2="575.9" y2="348.0" class="grid" />
<text x="575.9" y="366.0" text-anchor="middle" class="tick">100 ms</text>
<line x1="649.1" y1="94.0" x2="649.1" y2="348.0" class="grid" />
<text x="649.1" y="366.0" text-anchor="middle" class="tick">300 ms</text>
<line x1="729.4" y1="94.0" x2="729.4" y2="348.0" class="grid" />
<text x="729.4" y="366.0" text-anchor="middle" class="tick">1 s</text>
<line x1="802.6" y1="94.0" x2="802.6" y2="348.0" class="grid" />
<text x="802.6" y="366.0" text-anchor="middle" class="tick">3 s</text>
<line x1="882.9" y1="94.0" x2="882.9" y2="348.0" class="grid" />
<text x="882.9" y="366.0" text-anchor="middle" class="tick">10 s</text>
<text x="734.0" y="384.0" text-anchor="middle" class="axis-label">Median Page Latency (log scale, lower is faster)</text>
<text x="498.0" y="221.0" text-anchor="middle" transform="rotate(-90 498.0 221.0)" class="axis-label">BuJo Symbol Recall</text>
<polyline points="591.2,322.0 670.1,322.0 670.1,312.8 723.0,312.8 723.0,284.4 740.4,284.4 740.4,149.4 855.4,149.4 855.4,139.3" class="frontier-step" />
<polyline points="591.2,322.0 670.1,312.8 723.0,284.4 740.4,149.4 855.4,139.3" class="frontier-line" />
<line x1="740.4" y1="149.4" x2="731.4" y2="141.4" class="leader" />
<line x1="855.4" y1="139.3" x2="845.4" y2="159.3" class="leader" />
<circle cx="591.2" cy="322.0" r="6.0" class="pt-pareto" />
<circle cx="670.1" cy="312.8" r="6.0" class="pt-pareto" />
<circle cx="723.0" cy="284.4" r="6.0" class="pt-pareto" />
<circle cx="740.4" cy="149.4" r="6.0" class="pt-pareto" />
<circle cx="855.4" cy="139.3" r="6.0" class="pt-pareto" />
<circle cx="882.4" cy="139.3" r="5.0" class="pt-dom" />
<text x="587.2" y="342.0" text-anchor="start" class="lbl-pareto">Apple Vision Fast (0.0%)</text>
<text x="680.1" y="316.8" text-anchor="start" class="lbl-pareto">Apple Vision Accurate (4.5%)</text>
<text x="733.0" y="288.4" text-anchor="start" class="lbl-pareto">Supernote On-Device (18.6%)</text>
<text x="731.4" y="138.4" text-anchor="end" class="lbl-pareto">Gemini 3.5 Flash-Lite (85.5%)</text>
<text x="845.4" y="170.3" text-anchor="end" class="lbl-pareto">Gemini 3.6 Flash (90.5%)</text>
<text x="886.4" y="127.3" text-anchor="end" class="lbl-dom">Gemini 3.8 Flash (90.5%)</text>
</svg>
