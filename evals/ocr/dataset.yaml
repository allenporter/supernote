  - id: french_travel_phrases
    path: notebooks/french_phrases.note
    page_index: 1
    category: multilingual
    language: fr_FR
    description: Bilingual French/English travel questions with indented English translations and ç, ù diacritics.
    ground_truth: |-
      Travel
      Je ne parle pas français.
      Je ne comprends pas
      Pouvez-vous repeter s'il vous plait?
      Pouvez-vous m'aider s'il vous plait?
        - Can you help me please?
      Je veux acheter ça?
        - I want to buy this
      Où sont les toilettes?

      Je voudrais - rarely used and is formal
      Est-ce que je peux avoir un cafe svp?
        - can I have a coffee
      Je vais prendre un cafe
        - I'll take a coffee

