---
name: supernote-ocr-suite-v1
cases:
  # --- Bullet Journal: Daily Rapid Logging ---
  - id: bujo_daily_friday
    path: notebooks/daily.note
    page_index: 0
    category: bujo_daily
    prompt_type: daily
    description: Daily log on 5mm dot-grid with *, •, X, o, >, -, nested sub-items, and strikethrough.
    ground_truth: |-
      2026-11-07 Friday
      * • Review Q4 infrastructure budget
      X Send signed lease renewal to landlord
      o 10:30 Design sync with Maya and Leo
        - Agreed to ship local OCR before embeddings
        • Follow up on latency benchmark numbers
      > Migrate home NAS backup script to cron
      • ~~Order replacement Ceramic nibs~~
      o 17:45 Strength training session
        - Deadlift 3x5 at 275 lbs felt solid
      • Read two chapters of Designing Data Systems

  - id: bujo_daily_saturday
    path: notebooks/daily.note
    page_index: 1
    category: bujo_daily
    prompt_type: daily
    description: Technical daily log with PR numbers, semver tags, < scheduled-back item, and strikethrough.
    ground_truth: |-
      2026-11-08 Saturday
      * X Fix SQLite WAL lock timeout in PR #514
      • Tag v0.25.0 release candidate
        • Verify Linux wheel excludes pyobjc extras
      o 09:00 Farmers market and coffee run
      < Schedule annual dentist checkup for Dec
      > Draft blog post on self-hosted e-ink cloud
      • ~~Cancel unused staging VM instance~~
      - Latency dropped from 920ms to 165ms after warmup

  # --- Bullet Journal: Weekly Log & Review ---
  - id: bujo_weekly_w45
    path: notebooks/weekly.note
    page_index: 0
    category: bujo_weekly
    prompt_type: weekly
    description: Weekly plan and reflection review on ruled paper with starred tasks and nested notes.
    ground_truth: |-
      Week 45: Nov 2 - Nov 8
      * X Finalize multi-provider AI config schema
      * • Benchmark Apple Vision vs Ollama gemma3
      > Clean garage workbench and donate boxes
      o Wed 14:00 Quarterly roadmap review
        - Keep core container RAM under 160MB
      X Book Thanksgiving flights to Seattle

      Weekly Review
      - Shipped named providers and local macOS OCR
      - Biggest challenge: context switching mid-week
      • Next week focus: bounded summary chunking

  # --- Bullet Journal: Monthly Spread (Calendar + Goals) ---
  - id: bujo_monthly_calendar
    path: notebooks/monthly.note
    page_index: 0
    category: bujo_monthly
    prompt_type: monthly
    description: Left-hand monthly date timeline with events, starred release milestone, and completed tax item.
    ground_truth: |-
      November 2026
      o 1 Sun Daylight saving time ends
      o 3 Tue Election day
      * • 6 Fri Release v0.25.0 milestone
      o 9 Mon Pediatrician appointment 11:15
      o 14 Sat Trail half marathon in Marin
      X 18 Wed Quarterly tax estimate due
      o 21 Sat Host friendsgiving dinner
      o 26 Thu Thanksgiving family trip
      • 30 Mon Monthly budget and habit retro

  - id: bujo_monthly_goals
    path: notebooks/monthly.note
    page_index: 1
    category: bujo_monthly
    prompt_type: monthly
    description: Right-hand monthly goals and task list with forward/backward migrations and cancelled item.
    ground_truth: |-
      November Goals & Task List
      * • Complete 12 strength workouts this month
      X Publish OCR evaluation suite and docs
      • Add per-notebook custom vocabulary hints
        - Harvest keywords from .note metadata
      > Upgrade home server UPS battery pack
      < Move winter camping trip to January
      • ~~Rewrite legacy mobile sync prototype~~
      - Lesson learned: measure CER before tuning

