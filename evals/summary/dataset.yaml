      - page_index: 8
        page_id: LEGACY_WRK_0009
        text_content: |-
          (Northstar pilot feedback continued)
          • Root cause of >2GB zip timeout: buffering entire archive in RAM before sending headers
          • Decision: switch folder download to streaming `zipstream` generator with chunked transfer encoding
          • Owner: Sam — target hotfix v0.27.4 by Thursday March 5
          - Northstar IT lead (Jorge) confirmed remaining 280 seats will onboard March 16 once streaming zip lands
      - page_index: 9
        page_id: P20260309090000WRK0010
        text_content: |-
          Week of 2026-03-09 — Sprint 16 Kickoff
          X Shipped v0.27.4 with streaming zip export — 3.4GB folder downloads in 14s using <25MB RAM
          • Jorge (Northstar) confirmed streaming zip passed QA; green light for 280 more seats next week
