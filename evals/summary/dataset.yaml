      - page_index: 0
        page_id: P20260202090000WRK0001
        text_content: |-
          Week of 2026-02-02 — Sprint 14 Kickoff (Search & Sync Team)
          • Goal: reduce hybrid search p95 latency from 310ms to <150ms
          • Priya owns BM25 tokenization cache; Devon owns SQLite WAL tuning
          • Marcus reviewing OAuth PKCE refresh token rotation PR #418
          - Risk: Q1 enterprise pilot (Northstar Logistics, 400 seats) starts March 2
      - page_index: 1
        page_id: P20260205140000WRK0002
        text_content: |-
          2026-02-05 — Architecture Review: Hybrid Search Index & Caching
          Attendees: Priya, Devon, Sam, VP Eng (Claire)

          Context: Current hybrid search runs a full-table scan over 45k embedded chunks in Python using NumPy cosine similarity combined with unindexed LIKE queries. On multi-tenant nodes with >120k chunks, p95 latency spiked to 310ms and memory spiked by 480MB during concurrent query bursts.

          Options Evaluated:
          1. Move embeddings to pgvector on managed Postgres ($650/mo infra overhead, breaks single-binary SQLite self-hosting promise).
          2. Keep SQLite and pre-load float16 normalized embedding matrices per active tenant with an LRU cap of 64MB, paired with an in-memory inverted trigram index refreshed incrementally on DocumentIndexed events.
          3. Offload to Qdrant sidecar container (adds operational complexity for home-lab users).

          Decision: Approved Option 2 (SQLite + float16 tenant LRU + incremental lexical index).
          Action Items:
          • Priya: benchmark float16 vs float32 recall@10 on internal 10k query set by Feb 10 (target <0.5% NDCG drop).
          • Devon: add Prometheus histogram `search_query_duration_seconds` split by `lexical` vs `vector` stage.
          • Sam: document memory ceiling knobs (`MAX_EMBEDDING_CACHE_MB=256`) in operator guide.

          Follow-up Notes:
          - Claire emphasized zero regression for single-user Raspberry Pi 5 deployments (must stay under 180MB RSS).
          - Verified float16 quantization cuts matrix RAM exactly in half (24MB -> 12MB for 10k 768-dim chunks).
          - Next review checkpoint scheduled for Feb 19 after load testing with 200 concurrent simulated users.
          - Also flagged: stale tombstones in `f_chunk_index` are not pruned until nightly vacuum; add inline prune on file delete.
          - Confirmed backward compatibility: existing float32 JSON blobs decode seamlessly into float16 arrays at load time with zero migration required.
      - page_index: 2
        page_id: P20260209093000WRK0003
        text_content: |-
          Week of 2026-02-09 — Sprint 14 Midpoint
          X Priya completed float16 recall benchmark: NDCG@10 dropped only 0.12%, p95 fell to 112ms!
          X Devon merged `search_query_duration_seconds` metrics PR #429
          • Marcus fixed race condition in OAuth PKCE code verifier expiry
          > Prep staging environment for Northstar Logistics SSO test
      - page_index: 3
        page_id: P20260213160000WRK0004
        text_content: |-
          2026-02-13 — Sprint 14 Demo & Retro
          o 15:00 Live demo to Claire: hybrid search p95 at 112ms under 150 concurrent queries
          - What went well: float16 cache shipped in 1 week with zero schema changes
          - What to improve: staging seed script took 25 min to generate synthetic embeddings; cache fixtures in S3
          • Next sprint focus: webhook delivery reliability + Northstar SSO onboarding
      - page_index: 4
        page_id: P20260216090000WRK0005
        text_content: |-
          Week of 2026-02-16 — Sprint 15 Kickoff
          • Webhook dead-letter queue & exponential backoff (10s, 60s, 5m, 30m) — owner: Sam
          • Northstar Okta SAML -> OIDC bridge testing — owner: Marcus
          • Upgrade aiohttp to 3.14 and audit connection pool timeouts — owner: Devon
      - page_index: 5
        page_id: P20260219110000WRK0006
        text_content: |-
          2026-02-19 — Incident #408 Postmortem: SQLite Write Lock Contention
          Severity: SEV-2 | Duration: 22 minutes (Feb 18 14:12 - 14:34 UTC) | Incident Commander: Devon

          Summary: During a bulk import of 1,200 PDFs by beta tenant #44, background OCR workers held write transactions open while awaiting external Gemini HTTP responses. This caused `SQLITE_BUSY` timeouts on interactive login and file-list API requests (error rate peaked at 18.4%).

          Timeline:
          - 14:12 UTC: Alert `Http5xxRateHigh` fired; p99 DB lock wait exceeded 5,000ms.
          - 14:17 UTC: Devon identified 8 concurrent OCR workers holding open `AsyncSession` contexts during outbound API calls.
          - 14:24 UTC: Paused background processor queue via `/api/extended/system/processor/pause`; interactive 5xx dropped to 0% within 40 seconds.
          - 14:34 UTC: Resumed queue at `concurrency=2` after verifying WAL checkpoint caught up.

          Root Causes:
          1. `OcrModule` opened a session before calling `ocr_model.extract_text()` in a legacy retry branch.
          2. `busy_timeout` was 5,000ms while WAL autocheckpoint triggered synchronous frames on the main writer thread.
          3. No automated lint/test guard asserting zero open SQLite sessions across `await` network calls.

          Corrective Actions (Committed for Sprint 15):
          • Devon: split DB read -> release session -> HTTP LLM call -> open short DB write session in all processor modules (PR #441, due Feb 21).
          • Priya: add pytest fixture `assert_no_session_during_ai_call` to CI suite.
          • Sam: raise `PRAGMA busy_timeout = 15000` and add Grafana panel for `sqlite_lock_wait_ms`.
          • Marcus: rate-limit bulk upload bursts to 50 files/min per tenant with HTTP 429 + `Retry-After`.
      - page_index: 6
        page_id: P20260223090000WRK0007
        text_content: |-
          Week of 2026-02-23 — Sprint 15 Wrap & Northstar Readiness
          X Devon landed PR #441 fixing session-outside-LLM invariant
          X Priya added `assert_no_session_during_ai_call` CI guard
          X Marcus verified Northstar Okta OIDC login + group role mapping
          • Sam shipped webhook HMAC-SHA256 signing + 4-step backoff
      - page_index: 7
