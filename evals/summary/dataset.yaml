  - file_name: Project_Helios_Design.note
    custom_type: default
    description: >-
      16-page technical hardware/firmware notebook for a solar-powered LoRa
      weather station (Project Helios). Sparse dates, topical sections, and
      evolving specs across pages.
    pages:
      - page_index: 0
        page_id: P20260112100000HEL0001
        text_content: |-
          Project Helios — Off-Grid Solar LoRa Weather Station (2026-01-12)
          Goals:
          - Autonomous outdoor weather node lasting 14 days without sunlight
          - Telemetry every 5 minutes over 915MHz LoRaWAN to home gateway
          - Sensors: temp, humidity, barometric pressure, wind speed, rain gauge
          - Target BOM cost under $135 per node
      - page_index: 1
        page_id: P20260112113000HEL0002
        text_content: |-
          Initial Microcontroller & Radio Selection
          - MCU candidate A: ESP32-S3 (deep sleep ~18uA, easy Wi-Fi debug, cheap)
          - MCU candidate B: nRF52840 (deep sleep ~2.5uA, superior battery life)
          - Radio: Semtech SX1262 LoRa transceiver (+22dBm TX)
          - Initial pick: ESP32-S3 + SX1262 breakout for rapid prototyping
      - page_index: 2
        page_id: P20260118140000HEL0003
        text_content: |-
          Power Budget v1 (ESP32-S3)
          - Deep sleep: 22uA (MCU + regulator quiescent)
          - Wake + sensor read (1.2s): 45mA
          - LoRa TX SF9 (0.4s): 125mA
          - Average current @ 5-min interval: ~420uA (10.1 mAh/day)
          - Battery: single 18650 LiFePO4 (1500mAh) -> ~148 days theoretical, ~18 days realistic winter
      - page_index: 3
        page_id: P20260125090000HEL0004
        text_content: |-
          Sensor Suite BOM v1 (2026-01-25)
          - Temp/Humidity/Pressure: Bosch BME280 ($7.50)
          - Anemometer: Davis 6410 3-cup sensor ($48)
          - Rain gauge: Misol tipping bucket, 0.2794mm per tip ($18)
          - Solar panel: 6V 2W monocrystalline epoxy-coated ($11)
          - Charger IC: CN3791 MPPT LiFePO4 board ($6.50)
          - Enclosure: IP65 polycarbonate junction box + Stevenson radiation shield ($24)
          - Subtotal: $115 + $18 MCU/LoRa = $133 total
      - page_index: 4
        page_id: P20260204150000HEL0005
        text_content: |-
          Bench Prototype Assembly Notes
          - Wired BME280 over I2C (4.7k pullups), SX1262 over SPI
          - Tipping bucket reed switch debounced with 100nF cap + hardware interrupt
          - Discovered CN3791 charger draws 1.8mA reverse leakage at night! Must add Schottky blocking diode (SS14) or switch charger IC.
      - page_index: 5
        page_id: P20260211160000HEL0006
        text_content: |-
          Sensor Calibration & Drift Test (2026-02-11)
          - Tested BME280 against reference Kestrel 5500 over 72 hours
          - BME280 humidity read 4.5% high in fog (known condensation saturation issue)
          - Decision: replace BME280 with Sensirion SHT45 (built-in heater for anti-condensation, $9.20) + separate BMP390 barometer ($5.40)
      - page_index: 6
        page_id: P20260219100000HEL0007
        text_content: |-
          Firmware State Machine v1
          1. BOOT -> load calibration constants from NVS
          2. SAMPLE -> pulse SHT45 heater if RH > 85%, read wind pulses (3s window), read battery ADC
          3. PACK -> CBOR binary payload (18 bytes total, saves 60% airtime vs JSON)
          4. TX -> LoRaWAN OTAA unconfirmed uplink on SF7-SF9 ADR
          5. SLEEP -> RTC alarm 300s, rain gauge interrupt wakes counter only (no radio TX)
      - page_index: 7
        page_id: P20260226140000HEL0008
        text_content: |-
          Cold-Weather Chamber Test (2026-02-26)
          - Placed prototype in chest freezer at -12C for 24 hours
          - Finding #1: LiFePO4 battery cannot be charged below 0C (risk of lithium plating!)
          - Finding #2: ESP32-S3 brownout detector tripped during -12C LoRa TX spike
          - Mitigation plan (continued next page)
      - page_index: 8
        page_id: LEGACY_HEL_0009
        text_content: |-
          (Cold-weather mitigation plan cont.)
          - Add NTC thermistor cut-off circuit (10k NTC + comparator) to disable solar charging below +2C
          - Add 470uF low-ESR tantalum bulk capacitor across SX1262 VCC rail to absorb TX current spikes
          - Evaluate switching MCU to nRF52840 (RAK4631 WisBlock module) for lower cold-boot inrush and 1/5th sleep current
      - page_index: 9
        page_id: P20260307110000HEL0010
        text_content: |-
          MCU Migration: ESP32-S3 -> RAK4631 (nRF52840 + SX1262) (2026-03-07)
          - Switched primary board to RAK4631 ($29 integrated nRF52840 + SX1262)
          - Measured real deep sleep current: 4.1uA (down from 22uA on ESP32-S3!)
          - Replaced leaky CN3791 with TI BQ25570 energy harvester (488nA quiescent, built-in buck)
          - Re-ran -12C freezer test: zero brownouts across 200 consecutive TX cycles
      - page_index: 10
        page_id: P20260315130000HEL0011
        text_content: |-
          Roof Field Test #1 — 14-Day Soak (2026-03-15)
          - Mounted Helios v2 on south garage mast (3.5m height)
          - Gateway RSSI: -89 dBm, SNR: +8.5 dB at 1.4km suburban range
          - Battery voltage stayed between 3.31V and 3.36V even through 4 consecutive rainy days
          - Rain gauge recorded 41.2mm vs airport NWS station 40.8mm (within 1%!)
      - page_index: 11
        page_id: P20260324100000HEL0012
        text_content: |-
          Enclosure & Thermal Redesign
          - Noticed +1.8C daytime solar radiation bias on SHT45 inside 5-plate radiation shield
          - Added 2 extra matte-white UV-stabilized ASA plates (7 plates total) + black inner undersides
          - Daytime temp bias dropped from +1.8C to +0.25C
          - Switched cable glands to PG7 silicone-gasketed nylon to stop spider ingress
      - page_index: 12
        page_id: P20260402150000HEL0013
        text_content: |-
          LoRaWAN Gateway & Home Assistant Integration (2026-04-02)
          - ChirpStack v4 decoder parses 18-byte CBOR payload into MQTT discovery topics
          - Home Assistant dashboard tracks temp, dew point, wind gust, 24h rain, battery SoC, and RSSI
          - Added alert if no packet received for >30 minutes or battery < 3.15V
      - page_index: 13
        page_id: P20260410110000HEL0014
        text_content: |-
          Custom 2-Layer PCB Layout (Rev A)
          - Designed carrier PCB in KiCad 8 (68mm x 52mm) integrating RAK4631 socket, BQ25570, NTC <2C charge cutoff, and screw terminals
          - Ordered 5 bare PCBs + stencil from JLCPCB ($34 shipped)
          - Included TVS ESD protection diodes (USBLC6) on anemometer and rain gauge external wires
      - page_index: 14
        page_id: P20260419160000HEL0015
        text_content: |-
          Rev A Board Bring-Up & Final BOM (2026-04-19)
          - Soldered 2 Rev A boards on hotplate; both booted cleanly on first power-up
          - Verified NTC charge cutoff tripped at +1.9C using cold spray
          - Final unit BOM (qty 5): $141.80 (slightly over $135 target due to SHT45 + BQ25570, well worth reliability)
      - page_index: 15
        page_id: P20260425100000HEL0016
        text_content: |-
          Production Deployment & Next Ideas (2026-04-25)
          - Deployed Node #1 on home roof and Node #2 at Elena's hillside vineyard (4.2km LoRa link, RSSI -104 dBm)
          - 30-day packet delivery ratio: 99.6%
          - Future v3 ideas: ultrasonic wind sensor (no moving parts), lightning detector (AS3935)
