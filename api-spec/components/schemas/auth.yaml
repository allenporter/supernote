---
LoginDTO:
  type: object
  properties:
    password:
      type: string
      description: "Hashed password. Schema: SHA256(MD5(plain) + randomCode) or MD5(MD5(plain) + random)."
    countryCode:
      type: string
      description: Country code
    account:
      type: string
      description: User email or phone number
    browser:
      type: string
      description: Browser name (user agent info)
    equipment:
      type: integer
      description: "Device Type: 1 (Web), 2 (App), 3 (Terminal/Device), 4 (Platform)"
      enum: [1, 2, 3, 4]
    loginMethod:
      type: string
      description: "Login Method: '1' (Phone/Account), '2' (Email), '3' (WeChat)"
      enum: ["1", "2", "3"]
    language:
      type: string
      description: Language code
    equipmentNo:
      type: string
      description: Device serial number (SN12345678) or other client identifier (WEB)
    timestamp:
      type: integer
      format: int64
      description: Client timestamp
  required:
    - password
    - account
    - equipment
    - loginMethod

LoginVO:
  type: object
  allOf:
    - $ref: "common.yaml#/BaseVO"
    - type: object
      properties:
        token:
          type: string
          description: JWT Access Token
        counts:
          type: string
          description: Error count
        userName:
          type: string
          description: User nickname
        avatarsUrl:
          type: string
          description: Avatar URL
        lastUpdateTime:
          type: string
          format: date-time
        isBind:
          type: string
          enum: ["Y", "N"]
          description: Is account bound
        isBindEquipment:
          type: string
          enum: ["Y", "N"]
          description: Is device bound (Terminal only)
        soldOutCount:
          type: integer
          description: Logout count
        mfaRequired:
          type: boolean
          description: >-
            Whether MFA second-step verification is required (enforced only when
            equipment is 1 [Web] or 4 [Platform]; devices [equipment=3] and apps
            [equipment=2] bypass MFA)
        mfaToken:
          type: string
          description: >-
            Temporary pre-authentication token (valid for 5 minutes) returned
            when mfaRequired is true, used to call
            /api/official/user/account/login/mfa/verify

MfaLoginVerifyDTO:
  type: object
  properties:
    mfaToken:
      type: string
      description: Temporary pre-authentication token returned by first-step login
    code:
      type: string
      description: 6-digit TOTP code or one-time recovery code
    type:
      type: string
      description: "Verification code type: 'TOTP' (default) or 'RECOVERY'"
      enum: ["TOTP", "RECOVERY"]
    equipment:
      type: integer
      description: "Device Type: 1 (Web), 4 (Platform)"
      enum: [1, 4]
  required:
    - mfaToken
    - code
    - equipment

MfaSetupVO:
  type: object
  allOf:
    - $ref: "common.yaml#/BaseVO"
    - type: object
      properties:
        secret:
          type: string
          description: Base32 TOTP secret for manual Authenticator entry
        otpauthUrl:
          type: string
          description: Standard otpauth://totp/... provisioning URI
        qrCodeBase64:
          type: string
          description: QR code PNG encoded as a data URI (data:image/png;base64,...)

MfaEnableDTO:
  type: object
  properties:
    code:
      type: string
      description: 6-digit TOTP verification code from Authenticator app
  required:
    - code

MfaEnableVO:
  type: object
  allOf:
    - $ref: "common.yaml#/BaseVO"
    - type: object
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
          description: One-time recovery codes (XXXXX-XXXXX), returned only once

MfaDisableDTO:
  type: object
  properties:
    code:
      type: string
      description: 6-digit TOTP verification code or one-time recovery code
    type:
      type: string
      description: "Verification code type: 'TOTP' (default) or 'RECOVERY'"
      enum: ["TOTP", "RECOVERY"]
  required:
    - code

MfaStatusVO:
  type: object
  allOf:
    - $ref: "common.yaml#/BaseVO"
    - type: object
      properties:
        enabled:
          type: boolean
          description: Whether MFA is currently enabled for the user
        recoveryCodesRemaining:
          type: integer
          format: int32
          description: Number of unused one-time recovery codes remaining

SmsLoginDTO:
  type: object
  properties:
    email:
      type: string
      description: User email address
    browser:
      type: string
    equipment:
      type: integer
    validCode:
      type: string
      description: SMS/Email verification code
    validCodeKey:
      type: string
      description: "Redis session key for the code (must match prefix '{email}_validCode')."
    devices:
      type: string
      description: "OS Type: WINDOWS, MACOS, LINUX, ANDROID, IOS"
  required:
    - email
    - equipment
    - validCode
    - validCodeKey

RandomCodeDTO:
  type: object
  properties:
    account:
      type: string
      description: User account
    countryCode:
      type: string
    version:
      type: string
      description: "Protocol version (e.g., '202305')"
  required:
    - account

RandomCodeVO:
  type: object
  allOf:
    - $ref: "common.yaml#/BaseVO"
    - type: object
      properties:
        randomCode:
          type: string
          description: "Server-side nonce (salt) used for password hashing."
        timestamp:
          type: integer
          format: int64

QueryTokenVO:
  type: object
  allOf:
    - $ref: "common.yaml#/BaseVO"
    - type: object
      properties:
        token:
          type: string
          description: The valid token string

SmsLoginVO:
  type: object
  allOf:
    - $ref: "common.yaml#/BaseVO"
    - type: object
      properties:
        token:
          type: string
          description: JWT Access Token

EmailDTO:
  type: object
  properties:
    email:
      type: string
    language:
      type: string
  required:
    - email

ValidCodeDTO:
  type: object
  properties:
    validCodeKey:
      type: string
      description: Key for the validation code
    validCode:
      type: string
      description: The validation code
  required:
    - validCodeKey
    - validCode
